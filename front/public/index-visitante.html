<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Visitante - Gerenciamento de Itens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <script>
    (function() {
      var tema = localStorage.getItem('configTema') || 'padrao';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-tema', tema);
      });
    })();
  </script>
</head>
<body>
  <!-- Botão flutuante para login/registro (mobile) -->
  <div id="btnMenuUsuario" class="d-block d-md-none position-fixed" style="top:20px;left:20px;z-index:1050;">
    <button class="btn btn-light" style="border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);">
      <i class="fa fa-user fa-lg"></i>
    </button>
    <div id="menuUsuario" class="card shadow-sm" style="display:none;position:absolute;top:70px;left:0;width:160px;">
      <a href="/page/usuario/login.html" class="btn btn-light w-100">Login</a>
      <a href="/page/usuario/registrar.html" class="btn btn-outline-primary w-100">Criar Conta</a>
    </div>
  </div>
  <!-- Botão flutuante para abrir menu de gráficos (mobile) -->
  <button id="btnMenuGraficos" class="btn btn-info position-fixed d-block d-md-none" style="top:20px;right:20px;z-index:1050;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);">
    <i class="fa fa-chart-bar fa-lg"></i>
  </button>

  <!-- Menu lateral de gráficos -->
  <div id="menuGraficos" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="menuGraficosLabel" style="width:340px;">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menuGraficosLabel">Gráficos do Sistema</h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-4">
        <canvas id="graficoPorLocalMenu" style="width:100%;max-width:300px;height:180px;"></canvas>
        <div class="small text-dark mt-2">Itens por Local</div>
      </div>
      <div class="mb-4">
        <canvas id="graficoPorCategoriaMenu" style="width:100%;max-width:300px;height:180px;"></canvas>
        <div class="small text-dark mt-2">Itens por Categoria</div>
      </div>
      <div class="mb-4">
        <canvas id="graficoQtdPorCategoriaMenu" style="width:100%;max-width:300px;height:180px;"></canvas>
        <div class="small text-dark mt-2">Quantidade por Categoria</div>
      </div>
      <div class="mb-4">
        <canvas id="graficoItensPorDiaMenu" style="width:100%;max-width:300px;height:180px;"></canvas>
        <div class="small text-dark mt-2">Itens Adicionados por Dia</div>
      </div>
    </div>
  </div>
  <div class="d-flex">
    <aside class="kiwi-sidebar bg-primary text-white d-flex flex-column p-3" style="width:220px;min-height:100vh;position:fixed;top:0;left:0;z-index:100;">
      <h4 class="mb-4"><i class="fa fa-lemon"></i> Visitante</h4>
      <nav class="flex-grow-1">
    <a href="#" class="d-block mb-2 text-white"><i class="fa fa-home"></i> Dashboard</a>
      </nav>
      <div class="mt-auto d-flex flex-column gap-2">
        <a href="/page/usuario/login.html" class="btn btn-light btn-sm w-100 mb-1">Login</a>
        <a href="/page/usuario/registrar.html" class="btn btn-outline-light btn-sm w-100">Registrar</a>
      </div>
    </aside>
    <main class="flex-grow-1 p-4" style="background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;margin-left:220px;">
      <div class="container-fluid">
        <div class="row mb-4">
          <div class="col-md-3 d-none d-md-block">
            <div class="card text-center shadow-sm">
              <div class="card-body p-2">
                <canvas id="graficoPorLocal" width="80" height="80"></canvas>
                <div class="small text-white mt-2"><span style="color:#000000;">Itens por Local</span></div>
              </div>
            </div>
          </div>
          <div class="col-md-3 d-none d-md-block">
            <div class="card text-center shadow-sm">
              <div class="card-body p-2">
                <canvas id="graficoPorCategoria" width="80" height="80"></canvas>
                <div class="small text-white mt-2"><span style="color:#000000;">Itens por Categoria</span></div>
              </div>
            </div>
          </div>
          <div class="col-md-3 d-none d-md-block">
            <div class="card text-center shadow-sm">
              <div class="card-body p-2">
                <canvas id="graficoQtdPorCategoria" width="80" height="80"></canvas>
                <div class="small text-white mt-2"><span style="color:#000000;">Quantidade por Categoria</span></div>
              </div>
            </div>
          </div>
          <div class="col-md-3 d-none d-md-block">
            <div class="card text-center shadow-sm">
              <div class="card-body p-2">
                <canvas id="graficoItensPorDia" width="80" height="80"></canvas>
                <div class="small text-white mt-2"><span style="color:#000000;">Itens Adicionados por Dia</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-4 align-items-center">
          <div class="col-12 col-md-3 order-2 order-md-1 mb-3 mb-md-0">
            <input type="text" class="form-control" id="barraPesquisa" placeholder="Pesquisar itens...">
          </div>
          <div class="col-12 col-md-9 order-1 order-md-2 mb-3 mb-md-0">
            <div class="d-flex flex-wrap gap-2 justify-content-center py-2 rounded shadow-sm bg-white">
              <button id="btnFiltrar" class="btn btn-info px-4 py-2"><i class="fa fa-filter"></i> Filtrar</button>
              <button id="btnRelatorio" class="btn btn-success px-4 py-2"><i class="fa fa-download"></i> Baixar Relatório</button>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 mt-2 mt-md-0">
            <div class="card shadow-sm">
              <div class="card-header bg-primary text-white">
                Itens Salvos
              </div>
              <div class="card-body" id="itensBanco">
                <span class="text-muted">Carregando itens...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script>
// Função para carregar os 4 gráficos principais igual à dashboard
let chartPorLocal = null;
let chartPorCategoria = null;
let chartQtdPorCategoria = null;
let chartItensPorDia = null;

async function carregarGraficosPrincipais() {
  try {
    const response = await fetch('http://localhost:3000/api/itens');
    const itens = await response.json();
    // 1. Itens por Local
    const locais = {};
    itens.forEach(item => {
      locais[item.local] = (locais[item.local] || 0) + 1;
    });
    const locaisLabels = Object.keys(locais);
    const locaisValues = Object.values(locais);
    if (chartPorLocal) chartPorLocal.destroy();
    chartPorLocal = new Chart(document.getElementById('graficoPorLocal').getContext('2d'), {
      type: 'pie',
      data: { labels: locaisLabels, datasets: [{ data: locaisValues, backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0'] }] },
      options: { plugins: { legend: { display: true } } }
    });

    // 2. Itens por Categoria
    const categorias = {};
    itens.forEach(item => {
      categorias[item.categoriaNome] = (categorias[item.categoriaNome] || 0) + 1;
    });
    const catLabels = Object.keys(categorias);
    const catValues = Object.values(categorias);
    if (chartPorCategoria) chartPorCategoria.destroy();
    chartPorCategoria = new Chart(document.getElementById('graficoPorCategoria').getContext('2d'), {
      type: 'pie',
      data: { labels: catLabels, datasets: [{ data: catValues, backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0'] }] },
      options: { plugins: { legend: { display: true } } }
    });

    // 3. Quantidade total por Categoria
    const qtdPorCategoria = {};
    itens.forEach(item => {
      qtdPorCategoria[item.categoriaNome] = (qtdPorCategoria[item.categoriaNome] || 0) + Number(item.quantidade);
    });
    const qtdCatLabels = Object.keys(qtdPorCategoria);
    const qtdCatValues = Object.values(qtdPorCategoria);
    if (chartQtdPorCategoria) chartQtdPorCategoria.destroy();
    chartQtdPorCategoria = new Chart(document.getElementById('graficoQtdPorCategoria').getContext('2d'), {
      type: 'bar',
      data: { labels: qtdCatLabels, datasets: [{ data: qtdCatValues, backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0'] }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: true }, y: { display: true } } }
    });

    // 4. Itens adicionados por dia (usando campo real dataAdicionado)
    const dias = {};
    itens.forEach(item => {
      if (item.dataAdicionado) {
        dias[item.dataAdicionado] = (dias[item.dataAdicionado] || 0) + 1;
      }
    });
    // Ordena as datas
    const diasLabels = Object.keys(dias).sort();
    const diasValues = diasLabels.map(d => dias[d]);
    if (chartItensPorDia) chartItensPorDia.destroy();
    chartItensPorDia = new Chart(document.getElementById('graficoItensPorDia').getContext('2d'), {
      type: 'line',
      data: { labels: diasLabels, datasets: [{ data: diasValues, borderColor: '#36A2EB', fill: false }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: true }, y: { display: true } } }
    });
  } catch (e) {}
}
// Função para filtrar itens pela barra de pesquisa
document.getElementById('barraPesquisa').addEventListener('input', function() {
  const termo = this.value.toLowerCase();
  const lista = document.getElementById('itensBanco');
  Array.from(lista.children).forEach(item => {
    if (item.textContent.toLowerCase().includes(termo)) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });
});
async function carregarItens() {
  const lista = document.getElementById('itensBanco');
  lista.innerHTML = '<span class="text-muted">Carregando itens...</span>';
  try {
    const response = await fetch('http://localhost:3000/api/itens');
    const itens = await response.json();
    if (!Array.isArray(itens) || itens.length === 0) {
      lista.innerHTML = '<span class="text-muted">Nenhum item cadastrado.</span>';
      return;
    }
    lista.innerHTML = '';
    itens.forEach(item => {
      const div = document.createElement('div');
      div.className = "card mb-2 shadow-sm";
      div.innerHTML = `
        <div class="card-body">
          <h6 class="card-title">${item.nome} <span class="badge bg-info">${item.local || ''}</span></h6>
          <p class="card-text"><strong>Quantidade:</strong> ${item.quantidade}</p>
          <p class="card-text"><strong>Descrição:</strong> ${item.descricao}</p>
        </div>
      `;
      lista.appendChild(div);
    });
  } catch (error) {
    lista.innerHTML = '<span class="text-danger">Erro ao carregar itens.</span>';
  }
}
window.addEventListener('DOMContentLoaded', () => {
  // Botão para abrir modal de filtro (se existir)
  const btnFiltrarEl = document.getElementById('btnFiltrar');
  if (btnFiltrarEl) {
    btnFiltrarEl.addEventListener('click', function() {
      const modalEl = document.getElementById('modalFiltro');
      if (modalEl) {
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      }
    });
  }

  // Função de filtro igual ao dashboard principal (se existir)
  const formFiltroEl = document.getElementById('formFiltro');
  if (formFiltroEl) {
    formFiltroEl.addEventListener('submit', function(e) {
      e.preventDefault();
      const local = document.getElementById('filtroLocal') ? document.getElementById('filtroLocal').value : '';
      const lista = document.getElementById('itensBanco');
      if (!lista) return;
      lista.innerHTML = '<span class="text-muted">Carregando itens...</span>';
      fetch('http://localhost:3000/api/itens')
        .then(response => response.json())
        .then(itens => {
          lista.innerHTML = '';
          itens.filter(item => !local || item.local === local)
            .forEach(item => {
              const div = document.createElement('div');
              div.className = "card mb-2 shadow-sm";
              div.innerHTML = `
                <div class="card-body">
                  <h6 class="card-title">${item.nome} <span class="badge bg-info">${item.local || ''}</span></h6>
                  <p class="card-text"><strong>Quantidade:</strong> ${item.quantidade}</p>
                  <p class="card-text"><strong>Descrição:</strong> ${item.descricao}</p>
                </div>
              `;
              lista.appendChild(div);
            });
        })
        .catch(() => {
          lista.innerHTML = '<span class="text-danger">Erro ao carregar itens.</span>';
        });
      const modalInst = bootstrap.Modal.getInstance(document.getElementById('modalFiltro'));
      if (modalInst) modalInst.hide();
    });
  }

  // Botão de baixar relatório Word igual à dashboard principal (se existir)
  const btnRelatorioEl = document.getElementById('btnRelatorio');
  if (btnRelatorioEl) {
    btnRelatorioEl.addEventListener('click', function () {
      fetch('http://localhost:3000/api/relatorio-word')
        .then(response => {
          if (!response.ok) throw new Error('Erro ao gerar relatório Word.');
          return response.blob();
        })
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'relatorio-itens.docx';
          document.body.appendChild(a);
          a.click();
          a.remove();
        })
        .catch(error => {
          alert(error.message || 'Erro ao baixar o relatório.');
        });
    });
  }

  carregarItens();
  carregarGraficosPrincipais();
});
// Botões auxiliares: adiciona listeners apenas se os elementos existirem
const btnBaixarCsv = document.getElementById('btnBaixarRelatorio');
if (btnBaixarCsv) {
  btnBaixarCsv.addEventListener('click', async function() {
  try {
    const response = await fetch('http://localhost:3000/api/itens');
    const itens = await response.json();
    if (!Array.isArray(itens) || itens.length === 0) {
      alert('Nenhum item para baixar.');
      return;
    }
    // Gera CSV simples
    let csv = 'Nome,Local,Quantidade,Descrição\n';
    itens.forEach(item => {
      csv += `"${item.nome}","${item.local}","${item.quantidade}","${item.descricao}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'relatorio-itens.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Erro ao baixar relatório.');
  }
  });
}

const btnBaixarWord = document.getElementById('btnBaixarRelatorioWord');
if (btnBaixarWord) {
  btnBaixarWord.addEventListener('click', async function() {
    try {
      const response = await fetch('http://localhost:3000/api/relatorio-word');
      if (!response.ok) throw new Error('Erro ao baixar relatório Word');
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'relatorio-itens.docx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Erro ao baixar relatório Word.');
    }
  });
}
  </script>
<script>
// Botão flutuante de usuário (mobile)
const btnMenuUsuario = document.getElementById('btnMenuUsuario');
const menuUsuario = document.getElementById('menuUsuario');
btnMenuUsuario.querySelector('button').addEventListener('click', function(e) {
  e.stopPropagation();
  menuUsuario.style.display = menuUsuario.style.display === 'none' ? 'block' : 'none';
});
// Fecha o menu se clicar fora
document.addEventListener('click', function(e) {
  if (menuUsuario.style.display === 'block' && !btnMenuUsuario.contains(e.target)) {
    menuUsuario.style.display = 'none';
  }
});
</script>
<script>
// Botão para abrir menu lateral de gráficos
document.getElementById('btnMenuGraficos').addEventListener('click', function() {
  const offcanvas = new bootstrap.Offcanvas(document.getElementById('menuGraficos'));
  offcanvas.show();
  document.getElementById('btnMenuGraficos').style.display = 'none';
  carregarGraficosMenu();
  // Quando fechar, mostrar o botão novamente
  document.getElementById('menuGraficos').addEventListener('hidden.bs.offcanvas', function() {
    document.getElementById('btnMenuGraficos').style.display = 'flex';
  }, { once: true });
});

// Função para carregar gráficos no menu lateral

let chartPorCategoriaMenu = null;
let chartQtdPorCategoriaMenu = null;
let chartItensPorDiaMenu = null;
async function carregarGraficosMenu() {

    const catValues = Object.values(categorias);
    if (chartPorCategoriaMenu) chartPorCategoriaMenu.destroy();

    // 3. Quantidade total por Categoria
    const qtdPorCategoria = {};
    itens.forEach(item => {
      qtdPorCategoria[item.categoriaNome] = (qtdPorCategoria[item.categoriaNome] || 0) + Number(item.quantidade);
    });
    const qtdCatLabels = Object.keys(qtdPorCategoria);
    const qtdCatValues = Object.values(qtdPorCategoria);
    if (chartQtdPorCategoriaMenu) chartQtdPorCategoriaMenu.destroy();
    chartQtdPorCategoriaMenu = new Chart(document.getElementById('graficoQtdPorCategoriaMenu').getContext('2d'), {

    });

    // 4. Itens adicionados por dia
    const dias = {};
    itens.forEach(item => {
      if (item.dataAdicionado) {
        dias[item.dataAdicionado] = (dias[item.dataAdicionado] || 0) + 1;
      }
    });
    const diasLabels = Object.keys(dias).sort();
    const diasValues = diasLabels.map(d => dias[d]);
    if (chartItensPorDiaMenu) chartItensPorDiaMenu.destroy();
    chartItensPorDiaMenu = new Chart(document.getElementById('graficoItensPorDiaMenu').getContext('2d'), {
      type: 'line',
      data: { labels: diasLabels, datasets: [{ data: diasValues, borderColor: '#36A2EB', fill: false }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: true }, y: { display: true } }, responsive: true }
    });
  } catch (e) {}
}
</script>
  <!-- Modal Filtro (movido para o final do body) -->
  <div class="modal fade" id="modalFiltro" tabindex="-1" aria-labelledby="modalFiltroLabel" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalFiltroLabel">Filtrar Itens</h5>

                <option value="Banheiro">Banheiro</option>
                <option value="Auditório">Pátio</option>

  </div>
</body>
