<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Visitante - Gerenciamento de Itens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
  <div class="d-flex">
    <aside class="kiwi-sidebar bg-primary text-white d-flex flex-column p-3" style="width:220px;min-height:100vh;position:fixed;top:0;left:0;z-index:100;">
      <h4 class="mb-4"><i class="fa fa-lemon"></i> Visitante</h4>
      <nav class="flex-grow-1">
        <a href="#" class="d-block mb-2 text-white"><i class="fa fa-home"></i> Dashboard</a>
        <a href="#" class="d-block mb-2 text-white"><i class="fa fa-list"></i> Itens</a>
      </nav>
      <div class="mt-auto d-flex flex-column gap-2">
        <a href="/page/usuario/login.html" class="btn btn-light btn-sm w-100 mb-1">Login</a>
        <a href="/page/usuario/registrar.html" class="btn btn-outline-light btn-sm w-100">Registrar</a>
      </div>
    </aside>
    <main class="flex-grow-1 p-4" style="background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;margin-left:220px;">
      <div class="container-fluid">
        <div class="row mb-4">
          <div class="col-md-6 mb-4">
            <div class="card shadow-lg">
              <div class="card-header bg-primary text-white">Top 10 Itens Mais Movimentados</div>
              <div class="card-body">
                <canvas id="graficoBarraHorizontal" height="260"></canvas>
              </div>
            </div>
          </div>
          <div class="col-md-6 mb-4">
            <div class="card shadow-lg">
              <div class="card-header bg-primary text-white">Distribuição por Categoria</div>
              <div class="card-body">
                <canvas id="graficoDonut" height="260"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-12">
            <div class="card shadow-lg">
              <div class="card-header bg-primary text-white">Movimentação Total de Itens (Entradas/Saídas)</div>
              <div class="card-body">
                <canvas id="graficoLinha" height="260"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-4 align-items-center">
          <div class="col-md-9">
            <!-- Botões removidos para visitantes -->
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" id="barraPesquisa" placeholder="Pesquisar itens...">
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <div class="card shadow-sm">
              <div class="card-header bg-primary text-white">
                Itens Salvos
              </div>
              <div class="card-body" id="itensBanco">
                <span class="text-muted">Carregando itens...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
// Gráficos modernos usando Chart.js
async function carregarGraficosDashboard() {
  // Dados fictícios para exemplo visual
  // Substitua por dados reais do backend depois
  // Gráfico de barras horizontais (Top 10 itens)
  const topItens = {
    labels: ['Item A','Item B','Item C','Item D','Item E','Item F','Item G','Item H','Item I','Item J'],
    values: [120, 110, 95, 80, 75, 60, 55, 40, 35, 30]
  };
  new Chart(document.getElementById('graficoBarraHorizontal').getContext('2d'), {
    type: 'bar',
    data: {
      labels: topItens.labels,
      datasets: [{
        label: 'Movimentações',
        data: topItens.values,
        backgroundColor: '#36A2EB',
        borderRadius: 8,
        maxBarThickness: 28
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#eee' }, ticks: { color: '#333' } },
        y: { grid: { color: '#eee' }, ticks: { color: '#333' } }
      }
    }
  });
  // Gráfico donut (distribuição por categoria)
  const categorias = {
    labels: ['Alimentos','Limpeza','Papelaria','Bebidas','Outros'],
    values: [40, 25, 15, 10, 10]
  };
  new Chart(document.getElementById('graficoDonut').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: categorias.labels,
      datasets: [{
        data: categorias.values,
        backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF'],
        borderWidth: 2
      }]
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { color: '#333', font: { size: 14 } } } },
      cutout: '65%'
    }
  });
  // Gráfico de linha (movimentação total)
  const movimentacao = {
    labels: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set'],
    entradas: [50, 60, 55, 70, 80, 90, 85, 95, 100],
    saidas: [30, 40, 35, 50, 60, 65, 60, 70, 75]
  };
  new Chart(document.getElementById('graficoLinha').getContext('2d'), {
    type: 'line',
    data: {
      labels: movimentacao.labels,
      datasets: [
        {
          label: 'Entradas',
          data: movimentacao.entradas,
          borderColor: '#36A2EB',
          backgroundColor: 'rgba(54,162,235,0.1)',
          tension: 0.3,
          fill: true,
          pointRadius: 3
        },
        {
          label: 'Saídas',
          data: movimentacao.saidas,
          borderColor: '#FF6384',
          backgroundColor: 'rgba(255,99,132,0.1)',
          tension: 0.3,
          fill: true,
          pointRadius: 3
        }
      ]
    },
    options: {
      plugins: { legend: { position: 'top', labels: { color: '#333', font: { size: 14 } } } },
      scales: {
        x: { grid: { color: '#eee' }, ticks: { color: '#333' } },
        y: { grid: { color: '#eee' }, ticks: { color: '#333' } }
      }
    }
  });
}
// Função para filtrar itens pela barra de pesquisa
document.getElementById('barraPesquisa').addEventListener('input', function() {
  const termo = this.value.toLowerCase();
  const lista = document.getElementById('itensBanco');
  Array.from(lista.children).forEach(item => {
    if (item.textContent.toLowerCase().includes(termo)) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });
});
async function carregarItens() {
  const lista = document.getElementById('itensBanco');
  lista.innerHTML = '<span class="text-muted">Carregando itens...</span>';
  try {
    const response = await fetch('http://localhost:3000/api/itens');
    const itens = await response.json();
    if (!Array.isArray(itens) || itens.length === 0) {
      lista.innerHTML = '<span class="text-muted">Nenhum item cadastrado.</span>';
      return;
    }
    lista.innerHTML = '';
    itens.forEach(item => {
      const div = document.createElement('div');
      div.className = "card mb-2 shadow-sm";
      div.innerHTML = `
        <div class="card-body">
          <h6 class="card-title">${item.nome}</h6>
          <p class="card-text"><strong>Quantidade:</strong> ${item.quantidade}</p>
          <p class="card-text"><strong>Descrição:</strong> ${item.descricao}</p>
        </div>
      `;
      lista.appendChild(div);
    });
  } catch (error) {
    lista.innerHTML = '<span class="text-danger">Erro ao carregar itens.</span>';
  }
}
window.addEventListener('DOMContentLoaded', () => {
  carregarItens();
  carregarGraficosDashboard();
});
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
