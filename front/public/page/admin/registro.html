<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Modificações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/registro-portado.css">
</head>
<body>
  <nav class="navbar navbar-dark topbar mb-4">
    <div class="container-fluid">
      <div class="info-bloco">
        <span class="navbar-brand mb-0 h1">Registro de Modificações</span>
        <small class="topbar-subtitle">Painel para consultar todas as alterações registradas no sistema.</small>
      </div>
      <button class="btn btn-outline-light" onclick="window.location.href='/'">Voltar</button>
    </div>
  </nav>
  <main class="container page-wrapper">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div id="alerta" class="alert d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Data/Hora</th>
                <th>Usuário</th>
                <th>CPF</th>
                <th>Tipo</th>
                <th>Recurso</th>
                <th>Detalhes</th>
              </tr>
            </thead>
            <tbody id="tbodyRegistro">
              <tr><td colspan="6" class="text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/registro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
