<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Modificações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --cor-primaria: #1f2937;
      --cor-secundaria: #4b5563;
      --cor-escura: #111827;
      --cor-clara: #f3f4f6;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-secundaria) 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 32px;
    }

    .topbar {
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 25px rgba(17, 24, 39, 0.32);
    }

    .topbar .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--cor-clara);
    }

    .topbar .btn-outline-light {
      color: var(--cor-clara);
      border-color: rgba(229, 231, 235, 0.7);
      transition: all 0.2s ease;
    }

    .topbar .btn-outline-light:hover {
      background: var(--cor-clara);
      color: var(--cor-escura);
    }

    .page-wrapper {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-wrapper .card {
      border-radius: 18px;
      background: rgba(249, 250, 251, 0.94);
      border: 1px solid rgba(209, 213, 219, 0.8);
      box-shadow: 0 24px 45px rgba(17, 24, 39, 0.22);
    }

    .page-wrapper .card-body {
      padding: 2rem;
    }

    #alerta {
      border-radius: 12px;
      font-weight: 600;
    }

    .table {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 0;
    }

    .table thead {
      background: linear-gradient(90deg, rgba(75, 85, 99, 0.92), rgba(107, 114, 128, 0.92));
      color: var(--cor-clara);
      border: none;
    }

    .table thead th {
      border: none;
      text-transform: uppercase;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }

    .table tbody tr {
      background-color: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    }

    .table tbody tr:hover {
      background-color: rgba(229, 231, 235, 0.85);
    }

    .table tbody td {
      vertical-align: top;
      color: #1f2937;
      font-size: 0.95rem;
    }

    .badge-tipo {
      font-size: 0.85rem;
      letter-spacing: 0.01em;
      text-transform: capitalize;
      color: #fff;
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      box-shadow: 0 8px 14px rgba(17, 24, 39, 0.2);
    }
    .badge-tipo.tipo-criar { background: #15803d; }
    .badge-tipo.tipo-editar { background: #3b82f6; }
    .badge-tipo.tipo-deletar { background: #dc2626; }
    .badge-tipo[title*="deletar-grupo"], .badge-tipo.tipo-deletar-grupo { background: #6b21a8; }
    .badge-tipo.tipo-renomear-grupo { background: #f97316; }
    .badge-tipo.tipo-visualizar { background: #0ea5e9; }

    .detalhes-bloco {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
    }

    .detalhes-array {
      border-left: 3px solid rgba(107, 114, 128, 0.35);
      padding-left: 12px;
    }

    .detalhe-linha {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 0;
  border-bottom: 1px solid rgba(148, 163, 184, 0.4);
    }

    .detalhe-linha:last-child { border-bottom: none; }

    .detalhe-chave {
      font-weight: 600;
      min-width: 120px;
      color: var(--cor-secundaria);
      text-transform: capitalize;
    }

    .detalhe-valor {
      flex: 1;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detalhe-texto {
      color: #1f2937;
      display: block;
      white-space: pre-wrap;
    }

    @media (max-width: 992px) {
      body {
        padding: 16px 12px 24px;
      }

      .page-wrapper .card-body {
        padding: 1.5rem;
      }

      .detalhe-chave {
        min-width: 100px;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 0.75rem;
      }

      .topbar .navbar-brand {
        font-size: 1.1rem;
      }

      .page-wrapper .card-body {
        padding: 1.25rem;
      }

      .detalhe-chave {
        min-width: 80px;
      }
    }

    @media (max-width: 576px) {
      .topbar .container-fluid {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .table thead {
        font-size: 0.75rem;
      }

      .table tbody td {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark topbar mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Registro de Modificações</span>
      <button class="btn btn-outline-light" onclick="window.location.href='/'">Voltar</button>
    </div>
  </nav>
  <main class="container page-wrapper">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div id="alerta" class="alert d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Data/Hora</th>
                <th>Usuário</th>
                <th>CPF</th>
                <th>Tipo</th>
                <th>Recurso</th>
                <th>Detalhes</th>
              </tr>
            </thead>
            <tbody id="tbodyRegistro">
              <tr><td colspan="6" class="text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script>
    const escapeHTML = (str) => String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const LABEL_MAP = {
      nome: 'Nome',
      descricao: 'Descrição',
      quantidade: 'Quantidade',
      fk_Categoria_id: 'Categoria ID',
      categoria: 'Categoria',
      categoriaNome: 'Categoria',
      local: 'Local',
      estado: 'Estado',
      acao: 'Ação',
      recurso: 'Recurso',
      antes: 'Antes',
    alteracoes: 'Alterações',
    unidades: 'Unidades',
    usuario: 'Usuário',
    cpf: 'CPF'
    };

    const formatLabel = (key) => {
      if (!key) return '';
      if (LABEL_MAP[key]) return LABEL_MAP[key];
      const cleaned = key.toString().replace(/[_-]+/g, ' ');
      return cleaned.replace(/\b\w/g, (c) => c.toUpperCase());
    };

    const formatDetalhes = (value, depth = 0) => {
      if (value === null || value === undefined || value === '') {
        return '<span class="text-muted">Sem detalhes</span>';
      }

      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (depth < 3 && ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']')))) {
          try {
            return formatDetalhes(JSON.parse(trimmed), depth + 1);
          } catch (_) {
            /* segue para tratamento padrão */
          }
        }
        const safe = escapeHTML(value).replace(/\n/g, '<br>');
        return `<span class="detalhe-texto">${safe}</span>`;
      }

      if (typeof value === 'number' || typeof value === 'boolean') {
        return `<span class="detalhe-texto">${escapeHTML(String(value))}</span>`;
      }

      if (Array.isArray(value)) {
        if (value.length === 0) {
          return '<span class="text-muted">Lista vazia</span>';
        }
        return `<div class="detalhes-bloco detalhes-array">${value.map((item, idx) => `
          <div class="detalhe-linha">
            <span class="detalhe-chave">#${idx + 1}</span>
            <span class="detalhe-valor">${formatDetalhes(item, depth + 1)}</span>
          </div>
        `).join('')}</div>`;
      }

      if (typeof value === 'object') {
        const entries = Object.entries(value);
        if (entries.length === 0) {
          return '<span class="text-muted">Sem dados</span>';
        }
        return `<div class="detalhes-bloco">${entries.map(([k, v]) => `
          <div class="detalhe-linha">
            <span class="detalhe-chave">${escapeHTML(formatLabel(k))}</span>
            <span class="detalhe-valor">${formatDetalhes(v, depth + 1)}</span>
          </div>
        `).join('')}</div>`;
      }

      return `<span class="detalhe-texto">${escapeHTML(String(value))}</span>`;
    };

    const formatTipoBadge = (tipo) => {
      const normalized = (tipo || '-').toString().toLowerCase();
      const label = escapeHTML(tipo || '-');
      return `<span class="badge badge-tipo tipo-${normalized}" title="${label}">${label}</span>`;
    };

    const formatCPF = (valor) => {
      if (!valor) return '<span class="text-muted">-</span>';
      const digits = String(valor).replace(/\D/g, '');
      if (digits.length === 11) {
        const formatado = `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6, 9)}-${digits.slice(9)}`;
        return escapeHTML(formatado);
      }
      return escapeHTML(String(valor));
    };

    async function carregarRegistro() {
      const tbody = document.getElementById('tbodyRegistro');
      const alerta = document.getElementById('alerta');
      alerta.classList.add('d-none');
      tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Carregando...</td></tr>';
      try {
        const response = await fetch('http://localhost:3000/api/registro');
        if (!response.ok) throw new Error('Erro ao buscar registros.');
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Nenhuma modificação encontrada.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(reg => {
          const tipoBadge = formatTipoBadge(reg.tipo);
          const metaParts = [];
          if (reg.grupo) metaParts.push(`Grupo: ${escapeHTML(reg.grupo)}`);
          if (reg.itemId) metaParts.push(`Item ID: ${escapeHTML(String(reg.itemId))}`);
          const metaHtml = metaParts.length ? `<div class="text-muted small">${metaParts.join(' · ')}</div>` : '';
          const detalhesConteudo = reg.detalhes !== null && reg.detalhes !== undefined
            ? formatDetalhes(reg.detalhes)
            : formatDetalhes(reg.detalhesTexto ?? '-');
          const cpfHtml = formatCPF(reg.cpf);
          return `
            <tr>
              <td>${reg.dataHora ? new Date(reg.dataHora).toLocaleString('pt-BR') : '-'}</td>
              <td>
                <div class="fw-semibold">${escapeHTML(reg.usuario || '-')}</div>
                ${metaHtml}
              </td>
              <td>${cpfHtml}</td>
              <td>${tipoBadge}</td>
              <td>${escapeHTML(reg.recurso || '-')}</td>
              <td>${detalhesConteudo}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        alerta.classList.remove('d-none');
        alerta.classList.add('alert-danger');
        alerta.textContent = e.message || 'Erro ao carregar registro.';
        tbody.innerHTML = '<tr><td colspan="6" class="text-danger">Erro ao carregar registro.</td></tr>';
      }
    }
    document.addEventListener('DOMContentLoaded', carregarRegistro);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
