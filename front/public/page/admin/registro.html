<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Modificações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .badge-tipo {
      font-size: 0.85rem;
      letter-spacing: 0.01em;
      text-transform: capitalize;
    }
    .badge-tipo.tipo-criar { background-color: #198754; }
    .badge-tipo.tipo-editar { background-color: #0d6efd; }
    .badge-tipo.tipo-deletar { background-color: #dc3545; }
    .badge-tipo[title*="deletar-grupo"], .badge-tipo.tipo-deletar-grupo { background-color: #6f42c1; }
    .badge-tipo.tipo-visualizar { background-color: #20c997; }

    .detalhes-bloco {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
    }
    .detalhes-array {
      border-left: 3px solid #dee2e6;
      padding-left: 8px;
    }
    .detalhe-linha {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f3f5;
    }
    .detalhe-linha:last-child { border-bottom: none; }
    .detalhe-chave {
      font-weight: 600;
      min-width: 110px;
      color: #0d6efd;
      text-transform: capitalize;
    }
    .detalhe-valor {
      flex: 1;
      color: #212529;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .detalhe-texto {
      color: #212529;
      display: block;
      white-space: pre-wrap;
    }
    @media (max-width: 768px) {
      .detalhe-chave { min-width: 80px; }
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Registro de Modificações</span>
      <button class="btn btn-outline-light" onclick="window.location.href='/'">Voltar</button>
    </div>
  </nav>
  <main class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div id="alerta" class="alert d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th>Data/Hora</th>
                <th>Id ou Grupo</th>
                <th>Tipo</th>
                <th>Recurso</th>
                <th>Detalhes</th>
              </tr>
            </thead>
            <tbody id="tbodyRegistro">
              <tr><td colspan="5" class="text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script>
    const escapeHTML = (str) => String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const LABEL_MAP = {
      nome: 'Nome',
      descricao: 'Descrição',
      quantidade: 'Quantidade',
      fk_Categoria_id: 'Categoria ID',
      categoria: 'Categoria',
      categoriaNome: 'Categoria',
      local: 'Local',
      estado: 'Estado',
      acao: 'Ação',
      recurso: 'Recurso',
      antes: 'Antes',
      alteracoes: 'Alterações',
      unidades: 'Unidades',
      usuario: 'Usuário'
    };

    const formatLabel = (key) => {
      if (!key) return '';
      if (LABEL_MAP[key]) return LABEL_MAP[key];
      const cleaned = key.toString().replace(/[_-]+/g, ' ');
      return cleaned.replace(/\b\w/g, (c) => c.toUpperCase());
    };

    const formatDetalhes = (value, depth = 0) => {
      if (value === null || value === undefined || value === '') {
        return '<span class="text-muted">Sem detalhes</span>';
      }

      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (depth < 3 && ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']')))) {
          try {
            return formatDetalhes(JSON.parse(trimmed), depth + 1);
          } catch (_) {
            /* segue para tratamento padrão */
          }
        }
        const safe = escapeHTML(value).replace(/\n/g, '<br>');
        return `<span class="detalhe-texto">${safe}</span>`;
      }

      if (typeof value === 'number' || typeof value === 'boolean') {
        return `<span class="detalhe-texto">${escapeHTML(String(value))}</span>`;
      }

      if (Array.isArray(value)) {
        if (value.length === 0) {
          return '<span class="text-muted">Lista vazia</span>';
        }
        return `<div class="detalhes-bloco detalhes-array">${value.map((item, idx) => `
          <div class="detalhe-linha">
            <span class="detalhe-chave">#${idx + 1}</span>
            <span class="detalhe-valor">${formatDetalhes(item, depth + 1)}</span>
          </div>
        `).join('')}</div>`;
      }

      if (typeof value === 'object') {
        const entries = Object.entries(value);
        if (entries.length === 0) {
          return '<span class="text-muted">Sem dados</span>';
        }
        return `<div class="detalhes-bloco">${entries.map(([k, v]) => `
          <div class="detalhe-linha">
            <span class="detalhe-chave">${escapeHTML(formatLabel(k))}</span>
            <span class="detalhe-valor">${formatDetalhes(v, depth + 1)}</span>
          </div>
        `).join('')}</div>`;
      }

      return `<span class="detalhe-texto">${escapeHTML(String(value))}</span>`;
    };

    const formatTipoBadge = (tipo) => {
      const normalized = (tipo || '-').toString().toLowerCase();
      const label = escapeHTML(tipo || '-');
      return `<span class="badge badge-tipo tipo-${normalized}" title="${label}">${label}</span>`;
    };

    async function carregarRegistro() {
      const tbody = document.getElementById('tbodyRegistro');
      const alerta = document.getElementById('alerta');
      alerta.classList.add('d-none');
      tbody.innerHTML = '<tr><td colspan="5" class="text-muted">Carregando...</td></tr>';
      try {
  const response = await fetch('http://localhost:3000/api/registro');
        if (!response.ok) throw new Error('Erro ao buscar registros.');
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-muted">Nenhuma modificação encontrada.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(reg => {
          const tipoBadge = formatTipoBadge(reg.tipo);
          const metaParts = [];
          if (reg.grupo) metaParts.push(`Grupo: ${escapeHTML(reg.grupo)}`);
          if (reg.itemId) metaParts.push(`Item ID: ${escapeHTML(String(reg.itemId))}`);
          const metaHtml = metaParts.length ? `<div class="text-muted small">${metaParts.join(' · ')}</div>` : '';
          const detalhesConteudo = reg.detalhes !== null && reg.detalhes !== undefined
            ? formatDetalhes(reg.detalhes)
            : formatDetalhes(reg.detalhesTexto ?? '-');
          return `
            <tr>
              <td>${reg.dataHora ? new Date(reg.dataHora).toLocaleString('pt-BR') : '-'}</td>
              <td>
                <div class="fw-semibold">${escapeHTML(reg.usuario || '-')}</div>
                ${metaHtml}
              </td>
              <td>${tipoBadge}</td>
              <td>${escapeHTML(reg.recurso || '-')}</td>
              <td>${detalhesConteudo}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        alerta.classList.remove('d-none');
        alerta.classList.add('alert-danger');
        alerta.textContent = e.message || 'Erro ao carregar registro.';
        tbody.innerHTML = '<tr><td colspan="5" class="text-danger">Erro ao carregar registro.</td></tr>';
      }
    }
    document.addEventListener('DOMContentLoaded', carregarRegistro);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
