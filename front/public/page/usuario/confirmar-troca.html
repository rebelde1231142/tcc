<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Troca de Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 350px; margin: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div class="card p-4 text-center">
    <h2 class="mb-3">Confirmação de Troca de Senha</h2>
    <p>Para continuar, confirme que deseja trocar sua senha.</p>
    <button id="btnConfirmar" class="btn btn-primary w-100 mb-2">Confirmar troca de senha</button>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script>
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    const token = getTokenFromUrl();
    document.getElementById('btnConfirmar').addEventListener('click', async function() {
      const msg = document.getElementById('msg');
      msg.textContent = '';
      if (!token) {
        msg.textContent = 'Token não encontrado.';
        return;
      }
      // Chama backend para marcar token como confirmado
      try {
        const resp = await fetch('http://localhost:3000/api/usuarios/confirmar-troca', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (resp.ok) {
          msg.textContent = 'Confirmação realizada! Redirecionando...';
          setTimeout(() => {
            window.location.href = '/page/usuario/trocar-senha.html?token=' + token;
          }, 1200);
        } else {
          const data = await resp.json();
          msg.textContent = data.erro || 'Erro ao confirmar.';
        }
      } catch (err) {
        msg.textContent = 'Erro de conexão.';
      }
    });
  </script>
</body>
</html>
