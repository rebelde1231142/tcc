<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Troca de Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function() {
      var tema = localStorage.getItem('configTema') || 'padrao';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-tema', tema);
      });
    })();
  </script>
  <style>
    body { background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 350px; margin: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div class="card p-4 text-center">
    <div class="mb-3">
      <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="64" height="64">
    </div>
    <h2 class="mb-3">Confirmação de Troca de Senha</h2>
    <p class="mb-4">Para continuar, confirme que deseja trocar sua senha.</p>
    <button id="btnConfirmar" class="btn btn-primary w-100 mb-2">
      <span id="btnText">Confirmar troca de senha</span>
      <span id="loading" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
    </button>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script>
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    const token = getTokenFromUrl();
    const btnConfirmar = document.getElementById('btnConfirmar');
    const btnText = document.getElementById('btnText');
    const loading = document.getElementById('loading');
    btnConfirmar.addEventListener('click', async function() {
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      btnConfirmar.disabled = true;
      btnText.style.display = 'none';
      loading.style.display = 'inline-block';
      if (!token) {
        msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Token não encontrado.</span>';
        btnConfirmar.disabled = false;
        btnText.style.display = '';
        loading.style.display = 'none';
        return;
      }
      try {
        const resp = await fetch('http://localhost:3000/api/usuarios/confirmar-troca', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (resp.ok) {
          msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> Confirmação realizada! Redirecionando...</span>';
          setTimeout(() => {
            window.location.href = '/page/usuario/trocar-senha.html?token=' + token;
          }, 1200);
        } else {
          const data = await resp.json();
          msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle"></i> ${data.erro || 'Erro ao confirmar.'}</span>`;
        }
      } catch (err) {
        msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Erro de conexão.</span>';
      }
      btnConfirmar.disabled = false;
      btnText.style.display = '';
      loading.style.display = 'none';
    });
    // Adiciona ícones do Bootstrap Icons
    const linkIcons = document.createElement('link');
    linkIcons.rel = 'stylesheet';
    linkIcons.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css';
    document.head.appendChild(linkIcons);
  </script>
</body>
</html>
