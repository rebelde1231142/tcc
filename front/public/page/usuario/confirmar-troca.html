<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Troca de Senha</title>
  <link rel="stylesheet" href="/assets/css/usuario/confirmarTroca.css">
</head>
<body>
  <div class="confirm-card">
    <div class="mb-2 text-center">
      <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="80" height="80">
    </div>
    <h2>Confirmação de Troca de Senha</h2>
    <p>Para continuar, confirme que deseja trocar sua senha. Este processo é seguro e rápido.</p>
    <button id="btnConfirmar" class="btn btn-primary w-100 mb-2">
      <span id="btnText">Confirmar troca de senha</span>
      <span id="loading" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
    </button>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script src="/assets/js/usuario/confirmarTroca.js"></script>
</body>
</html>
