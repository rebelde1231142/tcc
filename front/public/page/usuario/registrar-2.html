<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script>
      (function() {
        var tema = localStorage.getItem('configTema') || 'padrao';
        document.addEventListener('DOMContentLoaded', function() {
          document.body.setAttribute('data-tema', tema);
        });
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/registrar-2.css">
  </head>
  <body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
      <div class="card card-reg shadow-lg w-100">
        <div class="card-body">
          <a href="/page/usuario/login.html" class="btn btn-light btn-lg rounded-pill shadow-sm d-flex align-items-center gap-2 mb-3" style="width: fit-content;">
        <span class="fw-semibold">Voltar</span>
      </a>
          <div class="text-center mb-4">
            <i class="bi bi-person-plus fs-1 text-primary"></i>
            <h2 class="h4 fw-bold mb-1 text-primary">Registrar</h2>
            <p class="text-muted mb-0">Crie sua conta para acessar o sistema</p>
          </div>

          <form id="formRegistro" novalidate>
            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" class="form-control form-control-lg" id="cpf" maxlength="11" required placeholder="Digite seu CPF (apenas números)">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control form-control-lg" id="email" required placeholder="Digite seu email">
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control form-control-lg" id="senha" required placeholder="Digite sua senha" autocomplete="off">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
            </div>
          </form>

          <div id="msg" class="mt-3 text-center text-muted small"></div>
        </div>
      </div>
    </main>
    <script src="/assets/js/registrar-2.js"></script>
  </body>
</html>
