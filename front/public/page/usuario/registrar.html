<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script>
      (function() {
        var tema = localStorage.getItem('configTema') || 'padrao';
        document.addEventListener('DOMContentLoaded', function() {
          document.body.setAttribute('data-tema', tema);
        });
      })();
    </script>
    <style>
  body{min-height:100vh;background:#e0e0e0;display:flex;align-items:center;justify-content:center;padding:20px;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial}
  .card-reg{width:100%;max-width:480px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.10);background:#f7f7f7}
  .card-body{padding:28px}
  .btn-primary{background:#5a5a5a;border:none}
  .btn-primary:hover{background:#444}
  .btn-light{background:#d3d3d3;color:#333}
  .text-primary{color:#5a5a5a!important}
  .text-muted{color:#888!important}
  @media(min-width:992px){.card-body{padding:36px 40px}}
  @media(max-width:520px){.card-body{padding:20px}}
    </style>
  </head>
  <body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
      <div class="card card-reg shadow-lg w-100">
        <div class="card-body">
          <a href="/index-visitante.html" class="btn btn-light btn-sm mb-3 shadow-sm">
            <i class="bi bi-arrow-left"></i> Voltar
          </a>
          <div class="text-center mb-4">
            <i class="bi bi-person-plus fs-1 text-primary"></i>
            <h2 class="h4 fw-bold mb-1 text-primary">Registrar</h2>
            <p class="text-muted mb-0">Crie sua conta para acessar o sistema</p>
          </div>

          <form id="formRegistro" novalidate>
            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" class="form-control form-control-lg" id="cpf" maxlength="11" required placeholder="Digite seu CPF (apenas números)">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control form-control-lg" id="email" required placeholder="Digite seu email">
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control form-control-lg" id="senha" required placeholder="Digite sua senha" autocomplete="off">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
            </div>
          </form>

          <div id="msg" class="mt-3 text-center text-muted small"></div>
        </div>
      </div>
    </main>

    <script>
      document.getElementById('formRegistro').addEventListener('submit', async function(e) {
        e.preventDefault();
        const cpf = document.getElementById('cpf').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const msg = document.getElementById('msg');
        msg.textContent = '';
        try {
          const resp = await fetch('http://localhost:3000/api/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ CPF: cpf, Email: email, Senha: senha })
          });
          if (resp.ok) {
            msg.textContent = 'Registrado com sucesso! Redirecionando...';
            setTimeout(() => {
              window.location.href = '/page/usuario/login.html';
            }, 1200);
          } else {
            const data = await resp.json();
            msg.textContent = data.erro || 'Erro ao registrar.';
          }
        } catch (err) {
          msg.textContent = 'Erro de conexão.';
        }
      });
    </script>
  </body>
</html>
