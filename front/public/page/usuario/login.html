<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/login.css">
        <script src="/assets/js/login.js"></script>
</head>
<body>
    <!-- body style já está no CSS -->
        <main class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="card shadow-lg p-4 w-100" style="max-width: 400px; background: #f7f7f7; border-radius: 16px;">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h2 class="h4 fw-bold mb-1 text-primary">Login</h2>
                    <p class="text-muted mb-0">Acesse sua conta</p>
                </div>
                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control form-control-lg" id="cpf" maxlength="11" required placeholder="Digite seu CPF">
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control form-control-lg" id="senha" required placeholder="Digite sua senha" autocomplete="off">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-entrar btn-lg">Entrar</button>
                    </div>
                </form>
                <button id="btnRegistrar" class="btn btn-light w-100 mt-3">Não tem conta? Registrar</button>
                <button id="btnTrocarSenha" class="btn btn-light w-100 mt-3">Esqueceu ou deseja trocar a senha?</button>
                <div id="alertaLogin" class="alert d-none mt-3" role="alert"></div>
            </div>
        </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="/assets/js/loginHideMenu.js"></script>
    <script src="/assets/js/loginForm.js"></script>
</body>
</html>
