<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trocar E-mail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function() {
      var tema = localStorage.getItem('configTema') || 'padrao';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-tema', tema);
      });
    })();
  </script>
  <style>
    body { background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 350px; margin: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div class="card p-4 shadow-lg" style="border-radius: 16px;">
    <h2 class="mb-3 text-center" style="font-weight:700; color:#2575fc;">Trocar E-mail</h2>
    <form id="trocarEmailForm">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de e-mail" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="cpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" name="cpf" required placeholder="Digite seu CPF">
      </div>
      <div class="mb-3">
        <label for="novoEmail" class="form-label">Novo E-mail</label>
        <input type="email" class="form-control" id="novoEmail" name="novoEmail" required placeholder="Digite o novo e-mail">
      </div>
      <button type="submit" class="btn btn-primary w-100">Trocar E-mail</button>
    </form>
    <div id="mensagem" class="mt-3 text-center"></div>
  </div>
  <script src="/assets/js/trocarEmail.js"></script>
</body>
</html>
