<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trocar E-mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/trocar-email.css">
  </head>
  <body>
    <div class="troca-card">
      <a href="/page/configuracao.html" class="btn btn-light btn-lg rounded-pill shadow-sm d-flex align-items-center gap-2 mb-3" style="width: fit-content;">
        <i class="bi bi-arrow-left fs-5"></i>
        <span class="fw-semibold">Voltar</span>
      </a>
      <h2 class="h4 text-center fw-bold mb-3" style="color: #5a5a5a;">Trocar E-mail</h2>
      <form id="trocarEmailForm" novalidate>
        <div class="mb-3 text-center">
          <img class="logo-img" src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca" width="48" height="48" />
        </div>
        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input id="cpf" name="cpf" class="form-control" type="text" placeholder="000.000.000-00" required />
        </div>
        <div class="mb-3">
          <label for="novoEmail" class="form-label">Novo e-mail</label>
          <input id="novoEmail" name="novoEmail" class="form-control" type="email" placeholder="seu@exemplo.com" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Trocar e-mail</button>
      </form>
      <div id="mensagem" class="text-center text-muted mt-3 small"></div>
    </div>

    <script src="/assets/js/trocarEmail.js"></script>
  </body>
</html>
