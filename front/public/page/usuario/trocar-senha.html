<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trocar Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function() {
      var tema = localStorage.getItem('configTema') || 'padrao';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-tema', tema);
      });
    })();
  </script>
  <style>
    body { background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 350px; margin: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div class="card p-4 shadow-lg" style="border-radius: 16px;">
    <h2 id="tituloTroca" class="mb-3 text-center" style="font-weight:700; color:#2575fc;">Trocar Senha</h2>
    <form id="formSolicitarEmail">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="emailSolicitado" class="form-label">Informe seu email cadastrado</label>
        <input type="email" class="form-control" id="emailSolicitado" required placeholder="Digite seu email">
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar link de troca</button>
    </form>
    <form id="formTrocaSenha" style="display:none;">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="novaSenha" class="form-label">Nova Senha</label>
        <input type="password" class="form-control" id="novaSenha" required placeholder="Nova senha">
      </div>
      <button type="submit" class="btn btn-success w-100">Trocar Senha</button>
      <div class="mt-2 text-muted text-center" style="font-size:0.95em;">Digite sua nova senha abaixo</div>
    </form>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script>
  // Removido: não exige mais autenticação para acessar a página de troca de senha

    // Detecta token na URL
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    const token = getTokenFromUrl();
    if (!token) {
      document.getElementById('formTrocaSenha').style.display = 'none';
      document.getElementById('formSolicitarEmail').style.display = '';
      document.getElementById('tituloTroca').style.display = '';
      const msg = document.getElementById('msg');
      let email = '';
      try {
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (usuarioLogado) {
          const user = JSON.parse(usuarioLogado);
          email = user.Email || '';
        }
      } catch {}
      msg.textContent = '';
      document.getElementById('formSolicitarEmail').addEventListener('submit', async function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('emailSolicitado').value;
        msg.textContent = '';
        try {
          const resp = await fetch('http://localhost:3000/api/usuarios/recuperar-senha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput })
          });
          if (resp.ok) {
            msg.textContent = 'Se o email estiver cadastrado, um link foi enviado. Verifique sua caixa de entrada.';
          } else {
            msg.textContent = 'Erro ao enviar email de troca.';
          }
        } catch (err) {
          msg.textContent = 'Erro de conexão.';
        }
      });
    } else {
      // Exibe apenas o formulário de troca de senha
      document.getElementById('formTrocaSenha').style.display = '';
      document.getElementById('formSolicitarEmail').style.display = 'none';
      document.getElementById('tituloTroca').style.display = 'none';
    }
    document.getElementById('formTrocaSenha').addEventListener('submit', async function(e) {
      e.preventDefault();
      const novaSenha = document.getElementById('novaSenha').value;
      const msg = document.getElementById('msg');
      msg.textContent = '';
      if (!novaSenha) {
        msg.textContent = 'Preencha todos os campos.';
        return;
      }
      // Só permite troca via token
      try {
        const resp = await fetch('http://localhost:3000/api/usuarios/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });
        if (resp.ok) {
          msg.textContent = 'Senha redefinida com sucesso!';
          setTimeout(() => { window.location.href = '/page/usuario/login.html'; }, 1200);
        } else {
          const data = await resp.json();
          msg.textContent = data.erro || 'Erro ao redefinir senha.';
        }
      } catch (err) {
        msg.textContent = 'Erro de conexão.';
      }
    });
  </script>
</body>
</html>
