<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trocar Senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #e5e7eb; /* Cor de fundo ajustada para consistência com outras páginas */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .troca-card {
      background: #f8f9fa; /* Fundo do card ajustado para consistência */
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 32px 16px;
      width: 100%;
      max-width: 400px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border: 1px solid #d1d5db; /* Borda ajustada para consistência */
    }
    .troca-card h2 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: #5a5a5a; /* Cor do título ajustada para consistência */
    }
    .form-label {
      font-size: 1.1rem;
      font-weight: 500;
      color: #374151; /* Cor do texto ajustada para consistência */
    }
    .form-control {
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px #6366f133;
    }
    .btn-primary {
      background: #5a6268; /* Cor do botão primário ajustada */
      border: none;
      color: #fff;
    }
    .btn-primary:hover {
      background: #4f46e5; /* Cor do botão primário no hover ajustada */
      color: #fff;
    }
    .btn-success {
      background: #10b981; /* Cor do botão de sucesso ajustada */
      border: none;
      color: #fff;
    }
    .btn-success:hover {
      background: #059669; /* Cor do botão de sucesso no hover ajustada */
      color: #fff;
    }
    .btn-light {
      background: #f3f4f6; /* Cor do botão leve ajustada */
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-light:hover {
      background: #e5e7eb; /* Cor do botão leve no hover ajustada */
      color: #374151;
    }
    .btn-secondary {
      background: #6c757d; /* Cor do botão secundário ajustada */
      border: none;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #5a6268; /* Cor do botão secundário no hover ajustada */
      color: #fff;
    }
    @media (max-width: 576px) {
      .troca-card {
        max-width: 100vw;
        min-width: 0;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 32px 8px 24px 8px;
        margin: 8px auto;
        gap: 18px;
        border: 1px solid #d1d5db;
      }
      .troca-card h2 {
        font-size: 1.3rem;
        margin-bottom: 12px;
        color: #374151;
      }
      .form-label {
        font-size: 1rem;
        color: #374151;
      }
      .form-control {
        font-size: 1rem;
        padding: 10px;
        border-radius: 7px;
        background: #fff;
        border: 1px solid #d1d5db;
        color: #374151;
      }
      .btn {
        font-size: 1rem;
        padding: 12px;
        border-radius: 7px;
      }
    }
    @media (min-width: 768px) {
      .troca-card {
        max-width: 500px;
        padding: 48px 32px;
        border: 1px solid #d1d5db;
      }
      .troca-card h2 {
        font-size: 2.2rem;
        color: #5a5a5a;
      }
    }
    @media (min-width: 1200px) {
      .troca-card {
        max-width: 600px;
        border: 1px solid #d1d5db;
      }
    }
  </style>
</head>
<body>
  <div class="troca-card">
    <a href="/page/usuario/login.html" class="btn btn-light btn-lg rounded-pill shadow-sm d-flex align-items-center gap-2 mb-3" style="width: fit-content;">
      <i class="bi bi-arrow-left fs-5"></i>
      <span class="fw-semibold">Voltar</span>
    </a>
    <h2 id="tituloTroca">Trocar Senha</h2>
    <form id="formSolicitarEmail">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="emailSolicitado" class="form-label">Informe seu email cadastrado</label>
        <input type="email" class="form-control" id="emailSolicitado" required placeholder="Digite seu email">
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar link de troca</button>
    </form>
    <form id="formTrocaSenha" style="display:none;">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="novaSenha" class="form-label">Digite sua nova senha</label>
        <input type="password" class="form-control" id="novaSenha" required placeholder="Nova senha" minlength="6">
        <small class="text-muted">A senha deve ter pelo menos 6 caracteres.</small>
      </div>
      <button type="submit" class="btn btn-secondary w-100">Atualizar Senha</button>
      <div class="mt-2 text-muted text-center" style="font-size:0.95em;">Digite sua nova senha abaixo</div>
    </form>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script>
    // Detecta token na URL
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    const token = getTokenFromUrl();
    if (!token) {
      document.getElementById('formTrocaSenha').style.display = 'none';
      document.getElementById('formSolicitarEmail').style.display = '';
      document.getElementById('tituloTroca').style.display = '';
      const msg = document.getElementById('msg');
      let email = '';
      try {
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (usuarioLogado) {
          const user = JSON.parse(usuarioLogado);
          email = user.Email || '';
        }
      } catch {}
      msg.textContent = '';
      document.getElementById('formSolicitarEmail').addEventListener('submit', async function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('emailSolicitado').value;
        msg.textContent = '';
        try {
          const resp = await fetch('http://localhost:3000/api/usuarios/recuperar-senha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput })
          });
          if (resp.ok) {
            msg.textContent = 'Se o email estiver cadastrado, um link foi enviado. Verifique sua caixa de entrada.';
          } else {
            msg.textContent = 'Erro ao enviar email de troca.';
          }
        } catch (err) {
          msg.textContent = 'Erro de conexão.';
        }
      });
    } else {
      // Exibe apenas o formulário de troca de senha
      document.getElementById('formTrocaSenha').style.display = '';
      document.getElementById('formSolicitarEmail').style.display = 'none';
      document.getElementById('tituloTroca').style.display = 'none';
    }
    document.getElementById('formTrocaSenha').addEventListener('submit', async function(e) {
      e.preventDefault();
      const novaSenha = document.getElementById('novaSenha').value;
      const msg = document.getElementById('msg');
      msg.textContent = '';
      if (!novaSenha) {
        msg.textContent = 'Preencha todos os campos.';
        return;
      }
      // Só permite troca via token
      try {
        const resp = await fetch('http://localhost:3000/api/usuarios/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });
        if (resp.ok) {
          msg.textContent = 'Senha redefinida com sucesso!';
          setTimeout(() => { window.location.href = '/page/usuario/login.html'; }, 1200);
        } else {
          const data = await resp.json();
          msg.textContent = data.erro || 'Erro ao redefinir senha.';
        }
      } catch (err) {
        msg.textContent = 'Erro de conexão.';
      }
    });
    const voltarBtn = document.querySelector('.btn-light');
    if (!token) {
      voltarBtn.href = '/page/configuracao.html'; // Voltar para configuração se estiver na página de envio de email
    } else {
      voltarBtn.href = '/page/usuario/login.html'; // Voltar para login se estiver na página de redefinição de senha
    }
  </script>
</body>
</html>
