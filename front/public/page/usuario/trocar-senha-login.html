<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trocar Senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/trocar-senha-login.css">
</head>
<body>
  <div class="troca-card">
  <a href="/page/usuario/login.html" class="btn btn-light btn-lg rounded-pill shadow-sm d-flex align-items-center gap-2 mb-3" style="width: fit-content;">
      <i class="bi bi-arrow-left fs-5"></i>
      <span class="fw-semibold">Voltar</span>
    </a>
    <h2 id="tituloTroca">Trocar Senha</h2>
    <form id="formSolicitarEmail">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="emailSolicitado" class="form-label">Informe seu email cadastrado</label>
        <input type="email" class="form-control" id="emailSolicitado" required placeholder="Digite seu email">
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar link de troca</button>
    </form>
    <form id="formTrocaSenha" style="display:none;">
      <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de senha" width="48" height="48">
      </div>
      <div class="mb-3">
        <label for="novaSenha" class="form-label">Nova Senha</label>
        <input type="password" class="form-control" id="novaSenha" required placeholder="Nova senha">
      </div>
      <button type="submit" class="btn btn-success w-100">Trocar Senha</button>
      <div class="mt-2 text-muted text-center" style="font-size:0.95em;">Digite sua nova senha acima</div>
    </form>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script src="/assets/js/trocar-senha-login.js"></script>
</body>
</html>
