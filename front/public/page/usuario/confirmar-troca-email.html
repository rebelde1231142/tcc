<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Troca de E-mail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function() {
      var tema = localStorage.getItem('configTema') || 'padrao';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-tema', tema);
      });
    })();
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 32px 0;
      width: 100vw;
      max-width: 100vw;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: stretch;
      justify-content: center;
    }
    .confirm-card h2 {
      font-size: 3.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: #2575fc;
      width: 100%;
    }
    .confirm-card p {
      font-size: 1.6rem;
      margin-bottom: 32px;
      color: #333;
      width: 100%;
    }
    .btn {
      font-size: 1.5rem;
      padding: 28px 0;
      border-radius: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      width: 100%;
    }
    @media (max-width: 576px) {
      .confirm-card {
        max-width: 100vw;
        min-width: 0;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        padding: 16px 0 16px 0;
        margin: 0;
        gap: 24px;
      }
      .confirm-card h2 {
        font-size: 2.2rem;
        margin-bottom: 18px;
      }
      .confirm-card p {
        font-size: 1.3rem;
        margin-bottom: 20px;
      }
      .btn {
        font-size: 1.3rem;
        padding: 22px 0;
        border-radius: 12px;
        width: 100%;
      }
    }
    @media (min-width: 768px) {
      .confirm-card {
        max-width: 600px;
        padding: 64px 48px;
      }
      .confirm-card h2 {
        font-size: 2.6rem;
      }
    }
    @media (min-width: 1200px) {
      .confirm-card {
        max-width: 700px;
      }
    }
  </style>
</head>
<body>
  <div class="confirm-card">
    <div class="mb-2 text-center">
      <img src="https://cdn-icons-png.flaticon.com/512/2950/2950736.png" alt="Troca de email" width="80" height="80">
    </div>
    <h2>Confirmação de Troca de E-mail</h2>
    <p>Para continuar, confirme que deseja trocar seu e-mail. Este processo é seguro e rápido.</p>
    <button id="btnConfirmar" class="btn btn-primary w-100 mb-2">
      <span id="btnText">Confirmar troca de e-mail</span>
      <span id="loading" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
    </button>
    <div id="msg" class="mt-3 text-center"></div>
  </div>
  <script>
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    const token = getTokenFromUrl();
    const btnConfirmar = document.getElementById('btnConfirmar');
    const btnText = document.getElementById('btnText');
    const loading = document.getElementById('loading');
    btnConfirmar.addEventListener('click', async function() {
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      btnConfirmar.disabled = true;
      btnText.style.display = 'none';
      loading.style.display = 'inline-block';
      if (!token) {
        msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Token não encontrado.</span>';
        btnConfirmar.disabled = false;
        btnText.style.display = '';
        loading.style.display = 'none';
        return;
      }
      try {
        const resp = await fetch('http://localhost:3000/api/usuarios/confirmar-troca-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (resp.ok) {
          msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> E-mail alterado com sucesso! Redirecionando...</span>';
          setTimeout(() => {
            window.location.href = '/page/configuracao.html';
          }, 1200);
        } else {
          const data = await resp.json();
          msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle"></i> ${data.erro || 'Erro ao confirmar.'}</span>`;
        }
      } catch (err) {
        msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Erro de conexão.</span>';
      }
      btnConfirmar.disabled = false;
      btnText.style.display = '';
      loading.style.display = 'none';
    });
    // Adiciona ícones do Bootstrap Icons
    const linkIcons = document.createElement('link');
    linkIcons.rel = 'stylesheet';
    linkIcons.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css';
    document.head.appendChild(linkIcons);
  </script>
</body>
</html>
