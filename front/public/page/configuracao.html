
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Configurações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .config-wrapper {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .config-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 32px 16px;
      width: 100%;
      max-width: 400px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .config-card h2 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .form-label {
      font-size: 1.1rem;
      font-weight: 500;
    }
    .form-control {
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 8px;
    }
    .btn {
      font-size: 1.1rem;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
    }
    @media (max-width: 576px) {
      .config-wrapper {
        padding: 0;
        align-items: flex-start;
      }
      .config-card {
        max-width: 100vw;
        min-width: 0;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        padding: 32px 12px 24px 12px;
        margin: 16px auto;
        gap: 18px;
      }
      .config-card h2 {
        font-size: 1.5rem;
        margin-bottom: 16px;
      }
      .form-label {
        font-size: 1.05rem;
      }
      .form-control {
        font-size: 1.05rem;
        padding: 10px;
        border-radius: 7px;
      }
      .btn {
        font-size: 1.05rem;
        padding: 13px;
        border-radius: 7px;
      }
      a.btn-link {
        font-size: 1rem;
        padding: 10px 0;
      }
    }
    @media (min-width: 768px) {
      .config-card {
        max-width: 500px;
        padding: 48px 32px;
      }
      .config-card h2 {
        font-size: 2.2rem;
      }
    }
    @media (min-width: 1200px) {
      .config-card {
        max-width: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="config-wrapper">
    <div class="config-card">
      <h2>Configurações</h2>
      <div>
        <label class="form-label" for="emailUsuario">Email cadastrado</label>
        <input type="email" class="form-control" id="emailUsuario" readonly>
      </div>
  <button class="btn btn-warning w-100" id="btnTrocarSenha">Trocar senha</button>
  <button class="btn btn-info w-100" id="btnTrocarEmail">Trocar e-mail</button>
  <button class="btn btn-danger w-100" id="btnLogout">Logout</button>
  <a href="/index.html" class="btn btn-link w-100">Voltar ao painel</a>
    </div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Exibir email do usuário logado
      const usuarioLogado = localStorage.getItem('usuarioLogado');
      if (usuarioLogado) {
        try {
          const user = JSON.parse(usuarioLogado);
          document.getElementById('emailUsuario').value = user.Email || '';
        } catch {
          document.getElementById('emailUsuario').value = '';
        }
      } else {
        document.getElementById('emailUsuario').value = '';
      }
      // Botão para troca de senha
      const btnTrocarSenha = document.getElementById('btnTrocarSenha');
      if (btnTrocarSenha) {
        btnTrocarSenha.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-senha.html';
        });
      }
      // Botão para troca de e-mail
      const btnTrocarEmail = document.getElementById('btnTrocarEmail');
      if (btnTrocarEmail) {
        btnTrocarEmail.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-email.html';
        });
      }
      // Botão de logout
      const btnLogout = document.getElementById('btnLogout');
      if (btnLogout) {
        btnLogout.addEventListener('click', function() {
          localStorage.removeItem('usuarioLogado');
          window.location.href = '/index-visitante.html';
        });
      }
    });
  </script>
</body>
</html>
