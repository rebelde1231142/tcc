  <title>Configurações do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/configuracao.css">
</head>
<body style="background: #bdbdbd;">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow rounded-4 border-0 p-4" style="background: #f5f5f5; border: 1px solid #d1d5db;">
          <div class="card-body">
            <h2 class="mb-4 text-center fw-bold" style="color: #444;">Configurações</h2>
            <form autocomplete="off">
              <div class="mb-3">
                <label for="emailUsuario" class="form-label" style="color: #555;">Email cadastrado</label>
                <input type="email" class="form-control" id="emailUsuario" readonly style="background: #f8f9fa; color: #444; border: 1px solid #cfd8dc;">
              </div>
              <!-- Informações de Nível e Área -->
              <div class="row mb-3">
                <div class="col-6">
                  <label for="nivelUsuario" class="form-label" style="color: #555; font-size: 0.9em;">Nível da Conta</label>
                  <div class="form-control" id="nivelUsuario" style="background: #f8f9fa; color: #444; border: 1px solid #cfd8dc; padding: 0.5rem 0.75rem; min-height: 38px; display: flex; align-items: center;">
                    —
                  </div>
                </div>
                <div class="col-6">
                  <label for="areaUsuario" class="form-label" style="color: #555; font-size: 0.9em;">Área de Atuação</label>
                  <div class="form-control" id="areaUsuario" style="background: #f8f9fa; color: #444; border: 1px solid #cfd8dc; padding: 0.5rem 0.75rem; min-height: 38px; display: flex; align-items: center;">
                    —
                  </div>
                </div>
              </div>
              <!-- Fim das informações de Nível e Área -->
              <div class="d-grid gap-3 mb-3">
                <button type="button" class="btn btn-lg btn-cfg btn-cfg-senha" id="btnTrocarSenha"><i class="fa fa-key me-2"></i>Trocar senha</button>
                <button type="button" class="btn btn-lg btn-cfg btn-cfg-email" id="btnTrocarEmail"><i class="fa fa-envelope me-2"></i>Trocar e-mail</button>
                <button type="button" class="btn btn-lg btn-cfg btn-cfg-logout" id="btnLogout"><i class="fa fa-sign-out-alt me-2"></i>Logout</button>
              </div>
              <div class="d-grid gap-2 mb-2">
                <a href="/page/admin/historico.html" id="linkHistoricoCfg" class="btn btn-outline-secondary d-none btn-cfg-link"><i class="fa fa-history me-2"></i>Histórico de alterações</a>
                <a href="/index.html" class="btn btn-secondary w-100 mb-2 d-flex align-items-center justify-content-center gap-2" style="background: #bdbdbd; color: #333; border: none;"><i class="fa fa-arrow-left"></i> Voltar ao painel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    body { background: #bdbdbd !important; }
    .btn-cfg {
      color: #333 !important;
      border: none !important;
      background: #bdbdbd !important;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .btn-cfg-senha { background: #bdbdbd !important; }
    .btn-cfg-email { background: #bdbdbd !important; }
    .btn-cfg-logout { background: #bdbdbd !important; }
    .btn-cfg-senha:hover, .btn-cfg-senha:focus {
      background: #6366f1 !important; /* roxo vivo */
      color: #fff !important;
      box-shadow: 0 2px 12px rgba(99,102,241,0.18);
    }
    .btn-cfg-email:hover, .btn-cfg-email:focus {
      background: #36A2EB !important; /* azul vivo */
      color: #fff !important;
      box-shadow: 0 2px 12px rgba(54,162,235,0.18);
    }
    .btn-cfg-logout:hover, .btn-cfg-logout:focus {
      background: #FF6384 !important; /* rosa vivo */
      color: #fff !important;
      box-shadow: 0 2px 12px rgba(255,99,132,0.18);
    }
    .btn-cfg-link {
      border-color: #bdbdbd !important;
      color: #555 !important;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-cfg-link:hover, .btn-cfg-link:focus {
      background: #374151 !important;
      color: #fff !important;
      border-color: #374151 !important;
      box-shadow: 0 2px 12px rgba(55,65,81,0.18);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Exibir email do usuário logado
      const usuarioLogado = localStorage.getItem('usuarioLogado');
      let userNivel = null;
      let userArea = null;
      if (usuarioLogado) {
        try {
          const user = JSON.parse(usuarioLogado);
          document.getElementById('emailUsuario').value = user.Email || '';
          userNivel = user.Nivel || user.nivel;
          userArea = user.Area || user.area;
          
          // Preencher Nível da Conta
          const nivelDisplay = document.getElementById('nivelUsuario');
          if (nivelDisplay) {
            const nivelFormatado = {
              'todos': '👑 Coordenação/Direção',
              'professor': '👨‍🏫 Professor',
              'auxiliar_docente': '� Auxiliar Docente'
            };
            nivelDisplay.textContent = nivelFormatado[userNivel] || userNivel || '—';
          }
          
          // Preencher Área de Atuação
          const areaDisplay = document.getElementById('areaUsuario');
          if (areaDisplay) {
            areaDisplay.textContent = userArea || '—';
          }
        } catch {
          document.getElementById('emailUsuario').value = '';
          document.getElementById('nivelUsuario').textContent = '—';
          document.getElementById('areaUsuario').textContent = '—';
        }
      } else {
        document.getElementById('emailUsuario').value = '';
        document.getElementById('nivelUsuario').textContent = '—';
        document.getElementById('areaUsuario').textContent = '—';
      }
      
      // Ocultar botões de Trocar Senha e Trocar Email se não for "todos"
      const btnTrocarSenha = document.getElementById('btnTrocarSenha');
      const btnTrocarEmail = document.getElementById('btnTrocarEmail');
      
      if (userNivel !== 'todos') {
        // Oculta os botões que não são permitidos
        if (btnTrocarSenha) btnTrocarSenha.style.display = 'none';
        if (btnTrocarEmail) btnTrocarEmail.style.display = 'none';
        console.log('Usuário ' + userNivel + ' - Botões de Senha e Email ocultados');
      } else {
        console.log('Usuário "todos" - Todos os botões visíveis');
      }
      
      // Mostrar link de histórico somente se CPF estiver na whitelist
      try {
        const u = JSON.parse(localStorage.getItem('usuarioLogado')||'null');
        const linkHist = document.getElementById('linkHistoricoCfg');
        if (u && linkHist) {
          const cpf = (u.CPF || u.cpf || '').replace(/\D/g,'');
          fetch('/api/auditoria/permissao', { headers: { 'X-User-CPF': cpf } })
            .then(r => r.ok ? r.json() : { permitido:false })
            .then(j => {
              if (j && j.permitido) {
                linkHist.classList.remove('d-none');
              }
            })
            .catch(() => {});
        }
      } catch (_) {}
      
      // Botão para troca de senha
      if (btnTrocarSenha) {
        btnTrocarSenha.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-senha.html';
        });
      }
      // Botão para troca de e-mail
      if (btnTrocarEmail) {
        btnTrocarEmail.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-email.html';
        });
      }
      // Botão de logout
      const btnLogout = document.getElementById('btnLogout');
      if (btnLogout) {
        btnLogout.addEventListener('click', function() {
          localStorage.removeItem('usuarioLogado');
          window.location.href = '/page/usuario/login.html';
        });
      }
    });
  </script>
</body>
</html>
