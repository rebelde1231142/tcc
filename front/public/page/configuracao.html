<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Configurações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .config-card { max-width: 400px; margin: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .form-control, .form-select {
      background: inherit;
      color: inherit;
    }
    .form-control:disabled, .form-control[readonly] {
      background: #e9ecef;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="config-card card p-4">
    <h2 class="mb-3 text-center">Configurações</h2>
    <div class="mb-3">
      <label class="form-label">Email cadastrado</label>
      <input type="email" class="form-control" id="emailUsuario" readonly>
    </div>


  <div id="msg" class="mt-3 text-center"></div>
    <button class="btn btn-warning w-100 mt-2" id="btnTrocarSenha">Trocar senha</button>
    <button class="btn btn-info w-100 mt-2" id="btnTrocarEmail">Trocar e-mail</button>
    <a href="/index.html" class="btn btn-link w-100 mt-2">Voltar ao painel</a>
  </div>
  <script>
  // Botão de salvar removido
    // Carregar email do usuário
    window.addEventListener('DOMContentLoaded', () => {
      // Exibir email do usuário logado
      const usuarioLogado = localStorage.getItem('usuarioLogado');
      if (usuarioLogado) {
        try {
          const user = JSON.parse(usuarioLogado);
          document.getElementById('emailUsuario').value = user.Email || '';
        } catch {
          document.getElementById('emailUsuario').value = '';
        }
      } else {
        document.getElementById('emailUsuario').value = '';
      }
      // Botão para troca de senha
      const btnTrocarSenha = document.getElementById('btnTrocarSenha');
      if (btnTrocarSenha) {
        btnTrocarSenha.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-senha.html';
        });
      }
      // Botão para troca de e-mail
      const btnTrocarEmail = document.getElementById('btnTrocarEmail');
      if (btnTrocarEmail) {
        btnTrocarEmail.addEventListener('click', function() {
          window.location.href = '/page/usuario/trocar-email.html';
        });
      }
    });
  </script>
</body>
</html>
